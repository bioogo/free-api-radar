name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check (engine + bundle)
        run: |
          node --check scripts/fetch-free-apis.mjs
          node --check lib/index.js
      - name: Offline refresh smoke test
        run: node scripts/fetch-free-apis.mjs refresh --offline
      - name: Verify generated JSON is valid
        run: node -e "const j=require('./data/free-apis.json'); if(!Array.isArray(j.entries)) throw new Error('bad entries'); console.log('entries:', j.entries.length)"
