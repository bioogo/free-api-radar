name: refresh-free-apis

# free-api-radar 每日自动刷新：
# 1) 运行引擎在线拉取全部数据源（各平台密钥从仓库 Secrets 注入，缺失的源自动跳过）
# 2) 把生成的 data/free-apis.json、data/free-apis.md、data/state.json、data/references/
#    提交回仓库（用 -f 强制添加，因为这些文件在 .gitignore 里）
# 3) 这样所有通过 `dsh plugin add git+...` 安装的用户，克隆下来就有最新快照

on:
  schedule:
    - cron: '0 2 * * *' # 每天 02:00 UTC（约北京时间 10:00）
  workflow_dispatch: {} # 支持手动触发

permissions:
  contents: write

concurrency:
  group: refresh-free-apis
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run free-api-radar refresh
        run: node scripts/fetch-free-apis.mjs refresh --stale-hours 0
        continue-on-error: true # 单源失败不阻断；生成物仍会被提交
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BIGMODEL_API_KEY: ${{ secrets.BIGMODEL_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          STEP_API_KEY: ${{ secrets.STEP_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QIANFAN_ACCESS_KEY: ${{ secrets.QIANFAN_ACCESS_KEY }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/free-apis.json data/free-apis.md data/state.json data/references/
          if git diff --cached --quiet; then
            echo "无数据变化，跳过提交"
          else
            git commit -m "chore(data): daily refresh $(date -u +%Y-%m-%d)"
            git push
          fi
